<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Clone Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Flipkart</h2>
    <input type="text" placeholder="Search for products">
    <button>Login</button>
</div>

<!-- Banner -->
<div class="banner">
    <h1>Big Billion Sale</h1>
</div>

<!-- Products -->
<div class="products">

    <div class="card">
        <img src="download2.jpg">
        <h3>Smartphone</h3>
        <p>₹15,999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="download1.jpg">
        <h3>Laptop</h3>
        <p>₹45,999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="download3.jpg">
        <h3>Shoes</h3>
        <p>₹999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
